{% extends "base.html" %}

{% block title %}Login - YCAP Email{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 5rem auto;">
    <div class="card">
        <h2 style="margin-bottom: 2rem; text-align: center;">✉️ YCAP Email Login</h2>
        
        <div id="alert"></div>
        
        <form id="loginForm">
            <div style="margin-bottom: 1rem;">
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" required 
                       placeholder="admin or admin^ycap.com"
                       style="width: 100%; padding: 0.75rem; margin-top: 0.5rem; border: 1px solid #ddd; border-radius: 5px;">
                <small style="color: #999; display: block; margin-top: 0.3rem;">Format: username or username^ycap.com</small>
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required
                       placeholder="••••••••"
                       style="width: 100%; padding: 0.75rem; margin-top: 0.5rem; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            
            <details style="margin-bottom: 1.5rem;">
                <summary style="cursor: pointer; color: #667eea;">Advanced Options</summary>
                <div style="margin-top: 1rem;">
                    <div style="margin-bottom: 1rem;">
                        <label for="host">Server Host:</label>
                        <input type="text" id="host" name="host" value="localhost"
                               style="width: 100%; padding: 0.75rem; margin-top: 0.5rem; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                    
                    <div style="margin-bottom: 1rem;">
                        <label for="port">Server Port:</label>
                        <input type="number" id="port" name="port" value="1200"
                               style="width: 100%; padding: 0.75rem; margin-top: 0.5rem; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                </div>
            </details>
            
            <button type="submit" class="btn" style="width: 100%; margin-bottom: 1rem;">Login</button>
        </form>
        
        <p style="text-align: center; color: #666;">Don't have an account? <a href="/signup" style="color: #667eea; text-decoration: none; font-weight: bold;">Sign up</a></p>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alert = document.getElementById('alert');
        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.textContent;
        
        btn.disabled = true;
        btn.textContent = 'Logging in...';
        
        try {
            const email = document.getElementById('email').value.trim();
            const response = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: email,
                    password: document.getElementById('password').value,
                    host: document.getElementById('host').value.trim(),
                    port: document.getElementById('port').value
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                alert.innerHTML = `<div class="alert alert-success">Login successful! Redirecting...</div>`;
                setTimeout(() => {
                    window.location.href = data.redirect;
                }, 1000);
            } else {
                alert.innerHTML = `<div class="alert alert-error">❌ ${data.error || 'Login failed'}</div>`;
                btn.disabled = false;
                btn.textContent = originalText;
            }
        } catch (e) {
            alert.innerHTML = `<div class="alert alert-error">❌ Error: ${e.message}</div>`;
            btn.disabled = false;
            btn.textContent = originalText;
        }
    });
</script>
{% endblock %}
