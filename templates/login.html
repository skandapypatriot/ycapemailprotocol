{% extends "base.html" %}

{% block title %}Login - YCAP Email{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 5rem auto;">
    <div class="card">
        <h2 style="margin-bottom: 2rem; text-align: center;">YCAP Email Login</h2>
        
        <div id="alert"></div>
        
        <form id="loginForm">
            <div style="margin-bottom: 1rem;">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required 
                       style="width: 100%; padding: 0.5rem; margin-top: 0.5rem; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required
                       style="width: 100%; padding: 0.5rem; margin-top: 0.5rem; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label for="host">Server Host:</label>
                <input type="text" id="host" name="host" value="localhost"
                       style="width: 100%; padding: 0.5rem; margin-top: 0.5rem; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            
            <div style="margin-bottom: 2rem;">
                <label for="port">Server Port:</label>
                <input type="number" id="port" name="port" value="1200"
                       style="width: 100%; padding: 0.5rem; margin-top: 0.5rem; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            
            <button type="submit" class="btn" style="width: 100%; margin-bottom: 1rem;">Login</button>
        </form>
        
        <p style="text-align: center;">Don't have an account? <a href="/signup" style="color: #667eea; text-decoration: none;">Sign up</a></p>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alert = document.getElementById('alert');
        
        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                    host: document.getElementById('host').value,
                    port: document.getElementById('port').value
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                window.location.href = data.redirect;
            } else {
                alert.innerHTML = `<div class="alert alert-error">${data.error}</div>`;
            }
        } catch (e) {
            alert.innerHTML = `<div class="alert alert-error">Error: ${e.message}</div>`;
        }
    });
</script>
{% endblock %}
